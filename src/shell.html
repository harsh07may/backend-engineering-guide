<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backend Engineering Field Guide</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script>try{var t=localStorage.getItem('be-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* Layout idea: a field manual. Fixed index on the left, one chapter at a time on the right,
   every topic the same shape so the eye learns where the code and the warning live. */
:root{
  --bg:#f4f6f3; --surface:#ffffff; --ink:#17211e; --muted:#5a6864; --line:#dbe1dc;
  --accent:#0a6b5d; --accent-soft:#e0efea; --warn:#8a5200; --warn-soft:#fbf1dc; --code-bg:#edf0ec;
  --tk-key:#8a2d6b; --tk-str:#2b6a1e; --tk-num:#8a5200; --tk-fn:#1f4fa3;
  --display:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#10171a; --surface:#162024; --ink:#e2e9e6; --muted:#94a39e; --line:#27353b;
    --accent:#5fcdb9; --accent-soft:#173a36; --warn:#e7b45a; --warn-soft:#33290f; --code-bg:#0b1113;
    --tk-key:#e29ac6; --tk-str:#a5d39a; --tk-num:#e7b45a; --tk-fn:#8fb8f2;
  }
}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#10171a; --surface:#162024; --ink:#e2e9e6; --muted:#94a39e; --line:#27353b;
  --accent:#5fcdb9; --accent-soft:#173a36; --warn:#e7b45a; --warn-soft:#33290f; --code-bg:#0b1113;
  --tk-key:#e29ac6; --tk-str:#a5d39a; --tk-num:#e7b45a; --tk-fn:#8fb8f2;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.62 var(--body);display:grid;grid-template-columns:292px minmax(0,1fr);-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-underline-offset:3px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* sidebar */
.side{border-right:1px solid var(--line);background:var(--surface);overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding:22px 16px 28px}
.brand{display:flex;align-items:flex-start;gap:10px;font:700 19px/1.15 var(--display);letter-spacing:-.01em;margin:0 6px}
.logo{flex:none;width:27px;height:27px;margin-top:-1px}
.logo .wire{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round}
.logo .hub{fill:var(--accent)}
.brand small{display:block;font:400 12.5px/1.4 var(--body);color:var(--muted);margin-top:4px;letter-spacing:0}
#q{width:100%;font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
#q::placeholder{color:var(--muted)}
#nav{display:flex;flex-direction:column;gap:2px}
.part{font:600 11px/1 var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:16px 8px 6px}
.part:first-child{margin-top:2px}
.nav-tools{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:-6px 2px -8px}
#theme{display:flex;gap:2px;padding:2px;border:1px solid var(--line);border-radius:8px}
#theme button{width:27px;height:22px;display:grid;place-items:center;padding:0;border:0;background:none;color:var(--muted);border-radius:6px;cursor:pointer}
#theme button:hover{color:var(--ink);background:var(--bg)}
#theme button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
#theme svg{display:block;width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}
#theme .fill{fill:currentColor;stroke:none}
#collapse{font:500 12px var(--body);color:var(--muted);background:none;border:0;padding:4px 6px;border-radius:5px;cursor:pointer}
#collapse:hover{color:var(--accent);background:var(--accent-soft)}
.cat-row{display:flex;align-items:center;gap:2px}
.cat-row .cat-link{flex:1;min-width:0}
.tog{flex:none;width:26px;height:26px;display:grid;place-items:center;border:0;background:none;color:var(--muted);border-radius:6px;cursor:pointer;font:500 15px/1 var(--mono)}
.tog:hover{background:var(--bg);color:var(--ink)}
.tog span{display:block;transition:transform .12s ease}
.tog[aria-expanded="true"] span{transform:rotate(90deg)}
.cat-link{display:flex;align-items:baseline;gap:9px;padding:6px 8px;border-radius:7px;color:var(--ink);text-decoration:none;font-size:14.5px;line-height:1.35}
.cat-link .n{font:500 11.5px var(--mono);color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
.cat-link .t{flex:1}
.cat-link em{font:500 11px var(--mono);font-style:normal;color:var(--muted);flex:none}
a.cat-link:hover{background:var(--bg)}
.cat-link.on{background:var(--accent-soft);font-weight:600}
.cat-link.on .n,.cat-link.on em{color:var(--accent)}
.cat-link.soon{color:var(--muted)}
.cat-link.soon em{border:1px solid var(--line);border-radius:99px;padding:1px 7px;font-size:10px}
.topics{list-style:none;margin:2px 0 6px 21px;padding:0 0 0 12px;border-left:1px solid var(--line);display:flex;flex-direction:column}
.topics a{display:flex;flex-direction:column;padding:3.5px 8px;border-radius:6px;font-size:13.5px;color:var(--muted);text-decoration:none}
.topics a:hover{color:var(--ink);background:var(--bg)}
.topics a.done{color:var(--ink)}
.topics a.done::before{content:"";position:absolute;margin:8px 0 0 -24px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.topics.flat{margin-left:0;padding-left:0;border:0}
.topics.flat a{color:var(--ink)}
.topics small{color:var(--muted);font-size:11.5px}
.none{color:var(--muted);font-size:13.5px;margin:4px 8px}

/* main */
#main{overflow-y:auto;scroll-behavior:smooth}
.bar{display:none}
.wrap{max-width:800px;margin:0 auto;padding:44px 32px 96px}
.cat{display:none}
.cat.on{display:block}
.eyebrow{font:500 12px var(--mono);color:var(--accent);margin:0 0 10px;letter-spacing:.02em}
h2{font:700 clamp(30px,5vw,42px)/1.08 var(--display);letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance}
.sum{font-size:18px;line-height:1.55;color:var(--muted);margin:0;max-width:62ch}
.cat-head{padding-bottom:26px;border-bottom:1px solid var(--line)}
.topic{padding:34px 0 30px;border-bottom:1px solid var(--line);scroll-margin-top:12px}
.topic-head{display:flex;align-items:center;gap:12px;justify-content:space-between;margin-bottom:8px}
h3{font:700 24px/1.2 var(--display);letter-spacing:-.01em;margin:0;text-wrap:balance}
h4{font:600 13px/1.3 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:24px 0 8px}
p,ul,ol{margin:0 0 14px;max-width:68ch}
ul,ol{padding-left:22px}
li{margin-bottom:5px}
.lede{font-size:17px}
strong,b{font-weight:600}
code{font:400 .88em var(--mono);background:var(--code-bg);padding:1.5px 5px;border-radius:4px;overflow-wrap:anywhere}
.mark{flex:none;font:500 12px var(--body);color:var(--muted);background:none;border:1px solid var(--line);border-radius:99px;padding:4px 11px;cursor:pointer}
.mark:hover{border-color:var(--accent);color:var(--accent)}
.mark[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

.code{margin:16px 0 18px;border:1px solid var(--line);border-radius:10px;background:var(--code-bg);overflow:hidden}
.code-head{display:flex;justify-content:space-between;align-items:center;padding:6px 8px 6px 14px;border-bottom:1px solid var(--line);font:500 11.5px var(--mono);color:var(--muted)}
.copy{font:500 11.5px var(--mono);color:var(--muted);background:none;border:0;padding:3px 8px;border-radius:5px;cursor:pointer}
.copy:hover{color:var(--accent);background:var(--accent-soft)}
pre{margin:0;padding:14px;overflow-x:auto;font:400 13.5px/1.6 var(--mono);tab-size:2}
pre code{background:none;padding:0;font-size:inherit;overflow-wrap:normal}
.hljs-keyword,.hljs-literal,.hljs-meta,.hljs-selector-tag{color:var(--tk-key)}
.hljs-string,.hljs-regexp,.hljs-subst .hljs-string{color:var(--tk-str)}
.hljs-number,.hljs-attr,.hljs-attribute,.hljs-symbol{color:var(--tk-num)}
.hljs-title,.hljs-built_in,.hljs-type,.hljs-section{color:var(--tk-fn)}
.hljs-comment{color:var(--muted);font-style:italic}

.tbl{overflow-x:auto;margin:16px 0 18px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14.5px;line-height:1.45}
th,td{text-align:left;padding:9px 13px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
th{font:600 12px var(--body);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
td:first-child{font-weight:500;white-space:nowrap}
td.num{font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:13px}

.flow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:16px 0 18px;padding:16px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:13.5px;line-height:1.3}
.flow span{border:1px solid var(--line);border-radius:7px;padding:7px 11px;background:var(--bg)}
.flow span b{display:block;font-size:11px;font-family:var(--mono);font-weight:500;color:var(--accent)}
.flow i{font-style:normal;color:var(--muted)}
.flow .hot{border-color:var(--accent);background:var(--accent-soft)}
.seq{list-style:none;padding:0;counter-reset:s;margin:16px 0 18px;border:1px solid var(--line);border-radius:10px;background:var(--surface);max-width:none}
.seq li{counter-increment:s;display:grid;grid-template-columns:26px minmax(0,190px) minmax(0,1fr);gap:10px;padding:9px 14px;border-bottom:1px solid var(--line);margin:0;font-size:14.5px}
.seq li:last-child{border-bottom:0}
.seq li::before{content:counter(s);font:500 12px var(--mono);color:var(--accent);padding-top:3px}
.seq b{font:500 13px var(--mono)}

.pit{border-left:3px solid var(--warn);background:var(--warn-soft);padding:11px 15px;border-radius:0 8px 8px 0;margin:18px 0 14px;font-size:15px;max-width:none}
.pit b:first-child{display:block;font:600 11.5px var(--body);letter-spacing:.07em;text-transform:uppercase;color:var(--warn);margin-bottom:3px}
.more{font-size:14.5px;color:var(--muted);margin:0}
.later{font:500 11px var(--mono);border:1px solid var(--line);border-radius:99px;padding:1px 7px;color:var(--muted);white-space:nowrap}
.pager{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:34px}
.pager a{flex:1 1 220px;border:1px solid var(--line);border-radius:10px;padding:13px 16px;text-decoration:none;color:var(--ink);background:var(--surface);font-weight:600}
.pager a:hover{border-color:var(--accent)}
.pager small{display:block;font:500 11.5px var(--mono);color:var(--muted);margin-bottom:2px}
.pager .next{text-align:right}

@media (max-width:860px){
  body{display:block}
  .side{position:fixed;inset:0 auto 0 0;width:min(300px,86vw);z-index:20;transform:translateX(-102%);transition:transform .18s ease}
  .nav-open .side{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.4)}
  #main{height:100%}
  .bar{display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px;font:700 15px var(--display)}
  #menu{flex:none;display:grid;place-items:center;width:34px;height:32px;padding:0;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:7px;cursor:pointer}
  #menu svg{display:block;width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round}
  #menu:hover{border-color:var(--accent);color:var(--accent)}
  .bar .logo{width:21px;height:21px;margin:0 -4px 0 0}
  .wrap{padding:26px 18px 72px}
  .seq li{grid-template-columns:22px minmax(0,1fr)}
  .seq li span{grid-column:2}
  .topic{scroll-margin-top:60px}
}
@media (prefers-reduced-motion:reduce){#main{scroll-behavior:auto}.side{transition:none}.tog span{transition:none}}
</style>
</head>
<body>
<aside class="side" id="side">
  <p class="brand"><svg class="logo" viewBox="0 0 24 24" role="img" aria-label="Backend Engineering Field Guide"><g class="wire"><path d="M10.15 8.43 6.9 14.48"/><path d="M13.85 8.43 17.1 14.48"/><path d="M9 18h6"/><circle cx="5" cy="18" r="2.6"/><circle cx="19" cy="18" r="2.6"/></g><circle class="hub" cx="12" cy="5" r="3"/></svg><span>Backend Engineering<small>A field guide in Node.js, Express 5 and TypeScript</small></span></p>
  <input id="q" type="search" placeholder="Search topics" aria-label="Search topics" autocomplete="off">
  <div class="nav-tools">
    <div id="theme" role="group" aria-label="Theme">
      <button type="button" data-theme="light" title="Light" aria-label="Light theme"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M8 1v1.6M8 13.4V15M1 8h1.6M13.4 8H15M3.05 3.05l1.15 1.15M11.8 11.8l1.15 1.15M3.05 12.95l1.15-1.15M11.8 4.2l1.15-1.15"/></svg></button>
      <button type="button" data-theme="dark" title="Dark" aria-label="Dark theme"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M14 8.53A6 6 0 1 1 7.47 2 4.67 4.67 0 0 0 14 8.53z"/></svg></button>
      <button type="button" data-theme="auto" title="Match system" aria-label="Match system theme"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path class="fill" d="M8 2a6 6 0 0 1 0 12z"/></svg></button>
    </div>
    <button id="collapse" type="button">Collapse all</button>
  </div>
  <nav id="nav" aria-label="Chapters"></nav>
</aside>
<main id="main">
  <div class="bar"><button id="menu" type="button" aria-controls="side" aria-expanded="false" aria-label="Chapters" title="Chapters"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h12"/></svg></button><svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><g class="wire"><path d="M10.15 8.43 6.9 14.48"/><path d="M13.85 8.43 17.1 14.48"/><path d="M9 18h6"/><circle cx="5" cy="18" r="2.6"/><circle cx="19" cy="18" r="2.6"/></g><circle class="hub" cx="12" cy="5" r="3"/></svg><span>Backend Engineering</span></div>
  <div class="wrap">
<!--SECTIONS-->
  </div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
(function () {
  // [id, title, checklist number, session it ships in]
  var PARTS = [
    ['Start here', [['start', 'Setup and conventions']]],
    ['Foundations', [['internet', 'How the Internet Works', 1, 1], ['os', 'Operating Systems', 5, 2], ['concurrency', 'Concurrency', 6, 2]]],
    ['Building APIs', [['apis', 'APIs', 2, 1], ['security', 'Security', 9, 3]]],
    ['Data', [['databases', 'Databases', 3, 1], ['storage', 'Data Storage', 4, 1]]],
    ['Scale', [['distributed', 'Distributed Systems', 7, 2], ['messaging', 'Messaging and Background Jobs', 8, 2], ['design', 'System Design', 10, 3], ['performance', 'Performance', 11, 3]]],
    ['Shipping', [['testing', 'Testing', 12, 4], ['deployment', 'Deployment and Infrastructure', 13, 4], ['observability', 'Observability', 14, 4]]],
    ['Capstone', [['capstone', 'Capstone Project', 15, 5]]]
  ];
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  var esc = function (s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;'); };
  var main = document.getElementById('main'), nav = document.getElementById('nav'), q = document.getElementById('q');
  var cats = $$('.cat'), current = 'start', done = {}, open = {};
  try { JSON.parse(localStorage.getItem('be-done') || '[]').forEach(function (id) { done[id] = 1; }); } catch (e) {}
  var name = function (t) { return t.querySelector('h3').textContent; };

  function renderNav() {
    var term = q.value.trim().toLowerCase(), h = '';
    if (term) {
      var hits = $$('.topic').filter(function (t) { return (name(t) + ' ' + (t.dataset.k || '')).toLowerCase().indexOf(term) > -1; });
      h += '<p class="part">' + hits.length + (hits.length === 1 ? ' match' : ' matches') + '</p><ul class="topics flat">';
      hits.forEach(function (t) { h += '<li><a href="#' + t.id + '">' + esc(name(t)) + '<small>' + esc(t.closest('.cat').dataset.title) + '</small></a></li>'; });
      h += '</ul>';
      if (!hits.length) h += '<p class="none">No topic matches. Try a shorter word.</p>';
    } else PARTS.forEach(function (p) {
      h += '<p class="part">' + p[0] + '</p>';
      p[1].forEach(function (c) {
        var el = document.getElementById(c[0]), n = c[2] ? ('0' + c[2]).slice(-2) : '00';
        if (!el) { h += '<span class="cat-link soon"><span class="n">' + n + '</span><span class="t">' + c[1] + '</span><em>Session ' + c[3] + '</em></span>'; return; }
        var ts = $$('.topic', el), d = ts.filter(function (t) { return done[t.id]; }).length;
        h += '<div class="cat-row"><a class="cat-link' + (c[0] === current ? ' on' : '') + '" href="#' + c[0] + '"><span class="n">' + n + '</span><span class="t">' + c[1] + '</span>' + (ts.length ? '<em>' + d + '/' + ts.length + '</em>' : '') + '</a>' +
          (ts.length ? '<button class="tog" type="button" data-cat="' + c[0] + '" aria-expanded="' + (open[c[0]] ? 'true' : 'false') + '" aria-label="' + (open[c[0]] ? 'Collapse ' : 'Expand ') + c[1] + '"><span aria-hidden="true">\u203A</span></button>' : '') + '</div>';
        if (open[c[0]] && ts.length) h += '<ul class="topics">' + ts.map(function (t) { return '<li><a href="#' + t.id + '"' + (done[t.id] ? ' class="done"' : '') + '>' + esc(name(t)) + '</a></li>'; }).join('') + '</ul>';
      });
    });
    nav.innerHTML = h;
  }

  function route() {
    var el = document.getElementById(location.hash.slice(1) || 'start');
    if (!el || !el.closest('.cat')) el = document.getElementById('start');
    var cat = el.closest('.cat');
    cats.forEach(function (c) { c.classList.toggle('on', c === cat); });
    current = cat.id;
    open[current] = 1;                       // arriving at a chapter expands it
    renderNav();
    setNav(false);
    if (el === cat) main.scrollTop = 0; else el.scrollIntoView();
  }

  // per-topic "learned" toggle, kept in this browser only
  $$('.topic').forEach(function (t) {
    var h3 = t.querySelector('h3'), head = document.createElement('div'), b = document.createElement('button');
    head.className = 'topic-head'; h3.parentNode.insertBefore(head, h3); head.appendChild(h3);
    b.type = 'button'; b.className = 'mark';
    var paint = function () { b.setAttribute('aria-pressed', done[t.id] ? 'true' : 'false'); b.textContent = done[t.id] ? 'Learned' : 'Mark learned'; };
    b.onclick = function () {
      if (done[t.id]) delete done[t.id]; else done[t.id] = 1;
      try { localStorage.setItem('be-done', JSON.stringify(Object.keys(done))); } catch (e) {}
      paint(); renderNav();
    };
    paint(); head.appendChild(b);
  });

  // copy buttons
  $$('.code').forEach(function (c) {
    var b = document.createElement('button'); b.type = 'button'; b.className = 'copy'; b.textContent = 'Copy';
    b.onclick = function () {
      navigator.clipboard.writeText(c.querySelector('code').textContent).then(function () { b.textContent = 'Copied'; }, function () { b.textContent = 'Select and copy'; });
      setTimeout(function () { b.textContent = 'Copy'; }, 1600);
    };
    c.querySelector('.code-head').appendChild(b);
  });

  // previous / next chapter, in checklist order
  cats.forEach(function (c, i) {
    var p = cats[i - 1], n = cats[i + 1], d = document.createElement('div'); d.className = 'pager';
    d.innerHTML = (p ? '<a href="#' + p.id + '"><small>Previous</small>' + esc(p.dataset.title) + '</a>' : '<span></span>') +
      (n ? '<a class="next" href="#' + n.id + '"><small>Next</small>' + esc(n.dataset.title) + '</a>' : '');
    c.appendChild(d);
  });

  // light / dark / system, remembered in this browser only
  var themeBox = document.getElementById('theme'), theme = 'auto';
  try { theme = localStorage.getItem('be-theme') || 'auto'; } catch (e) {}
  if (theme !== 'light' && theme !== 'dark') theme = 'auto';
  function paintTheme() {
    if (theme === 'auto') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', theme);
    $$('button', themeBox).forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.theme === theme ? 'true' : 'false'); });
  }
  themeBox.addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    theme = b.dataset.theme;
    try { localStorage.setItem('be-theme', theme); } catch (e) {}
    paintTheme();
  });
  paintTheme();

  var menu = document.getElementById('menu');
  function setNav(on) {
    document.body.classList.toggle('nav-open', on);
    menu.setAttribute('aria-expanded', on ? 'true' : 'false');
  }
  menu.onclick = function () { setNav(!document.body.classList.contains('nav-open')); };
  main.addEventListener('click', function (e) { if (!e.target.closest('#menu')) setNav(false); });
  q.addEventListener('input', renderNav);
  nav.addEventListener('click', function (e) {
    var tog = e.target.closest('.tog'), link = e.target.closest('a.cat-link'), id;
    if (tog) id = tog.dataset.cat;
    else if (link && link.getAttribute('href') === '#' + current && (location.hash.slice(1) || 'start') === current) id = current;   // chapter already showing: its link toggles too
    if (!id) return;
    if (open[id]) delete open[id]; else open[id] = 1;
    renderNav();
    var again = nav.querySelector('.tog[data-cat="' + id + '"]');
    if (tog && again) again.focus();          // keep keyboard focus on the toggle
  });
  document.getElementById('collapse').onclick = function () { open = {}; renderNav(); };
  addEventListener('hashchange', route);
  if (window.hljs) hljs.highlightAll();
  route();
})();
</script>
</body>
</html>
